<header class="topbar">
  <a class="topbar-brand" routerLink="/">
    <img
      src="https://assets.qrati.com/images/qrati-connect-logo-square.png"
      alt="Qrati Connect logo"
      referrerpolicy="no-referrer"
    />
    <span>Qrati Connect</span>
  </a>

  <div class="topbar-actions">
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode" (click)="toggleTheme()">
  <svg
    class="theme-icon"
    [class.hidden]="theme() === 'dark'"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
  </svg>

  <svg
    class="theme-icon"
    [class.hidden]="theme() === 'light'"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="12" cy="12" r="5" />
    <path
      d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
    />
  </svg>
</button>
    @if (user(); as u) {
      <div class="user-profile">
        <div class="avatar" aria-hidden="true">{{ initials() }}</div>
        <span class="user-name">{{ u.fullName }}</span>
      </div>
      <button class="topbar-btn topbar-btn--outline" type="button" (click)="logout()">
        Logout
      </button>
    } @else {
      <a class="topbar-btn topbar-btn--filled" routerLink="/login">Login</a>
    }
  </div>
</header>
